# CI for @amatelic/jev — typecheck, build, tests (with HF model cache), pipeline dry-run.
# Node 22 on ubuntu-latest. No schedules: every run is push/PR/dispatch-triggered only.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package.json carries an "allowScripts" map approving the onnxruntime-node
      # postinstall script — required for native (ONNX) inference in tests.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsc emit)
        run: npm run build

      # Cache the HuggingFace hub cache (~/.cache/huggingface) keyed on the lockfile.
      # Correctness note: the model-dependent tests in src/index.test.ts self-skip
      # when the model cannot load (beforeAll try/catch), so on a cold cache this
      # step degrades to schema-only tests instead of failing CI. With a warm cache
      # the full suite runs against real ONNX models, fully offline.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
        run: npx vitest run

      # Pipeline dry-run smoke: must exit 0 without executing heavy stages.
      - name: Pipeline dry-run smoke
        run: node scripts/pipeline.mjs --dry-run

